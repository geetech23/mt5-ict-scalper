<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICT Scalper Dashboard</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <h1>ICT Scalper</h1>
  <span id="conn" class="badge">…</span>
  <span id="mode" class="badge"></span>
</header>
<main>
  <section class="card"><h2>Session</h2>
    <div id="session" class="big">–</div>
    <div id="countdown"></div>
    <div id="session-hours" class="muted"></div></section>
  <section class="card"><h2>Account</h2>
    <div>Balance: <b id="balance">–</b></div>
    <div>Equity: <b id="equity">–</b></div>
    <div id="risk" class="muted"></div></section>
  <section class="card"><h2>Today</h2>
    <div>Wins: <b id="wins">0</b> · Losses: <b id="losses">0</b></div>
    <div>Win rate: <b id="winrate">0</b>%</div>
    <div>Net P&amp;L: <b id="net">0</b></div></section>
  <section class="card wide"><h2>ICT Signals</h2><div id="signals"></div></section>
  <section class="card wide"><h2>Zones (OB / FVG)</h2><pre id="zones"></pre></section>
  <section class="card wide"><h2>Open Positions</h2>
    <div class="scroll"><table id="positions"><thead><tr><th>Symbol</th><th>Side</th><th>Lots</th><th>Entry</th><th>SL</th><th>TP</th><th>P&amp;L</th></tr></thead><tbody></tbody></table></div></section>
  <section class="card wide"><h2>Last 20 Trades</h2>
    <div class="scroll"><table id="journal"><thead><tr><th>Time</th><th>Symbol</th><th>Side</th><th>Entry</th><th>Exit</th><th>P&amp;L</th><th>Reason</th></tr></thead><tbody></tbody></table></div></section>
</main>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
